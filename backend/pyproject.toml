[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-assistant"
version = "0.1.0"
description = "A single-PDF retrieval-augmented chat assistant"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# The house rule in this portfolio is standard library only. This repo breaks
# it, and these are the exceptions, each because reimplementing it would be the
# opposite of the point:
#   fastapi/uvicorn   streaming NDJSON over multipart upload, with a schema
#   llama-index-core  the sentence splitter
#   faiss-cpu         the vector index
#   pypdf             PDF parsing
#   pymongo           MongoDB
# Everything else — the HTTP client to ollama, the scoring, the prompt, the
# state machine, the in-memory index — is standard library.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "llama-index-core>=0.11",
  "faiss-cpu>=1.8",
  "numpy>=1.26",
  "pypdf>=4.2",
  "pymongo>=4.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6", "pre-commit>=3.7"]

[project.scripts]
rag-assistant = "rag_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ANN"]
ignore = ["ANN401", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "E501"]
"examples/*" = ["ANN", "E501", "S101"]
